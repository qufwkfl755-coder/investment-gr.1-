<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입자 클린 경매 - 실시간 멀티 디바이스 웹앱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;

        }
        .font-title {
            font-family: 'Gowun Dodum', sans-serif;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glow-effect {
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.35);
        }
        .badge-glow {
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: #4f46e5;
            border-radius: 4px;
        }
    </style>
</head>
<body class="p-3 md:p-5 flex flex-col justify-between min-h-screen">

    <header class="glass-panel rounded-2xl p-3.5 mb-3 flex flex-wrap justify-between items-center shadow-lg border-b border-indigo-500/20">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600/30 p-2.5 rounded-xl border border-indigo-400/30 text-indigo-400 text-xl">
                <i class="fa-solid fa-atom fa-spin-pulse" style="--fa-animation-duration: 8s;"></i>
            </div>
            <div>
                <h1 class="text-lg md:text-xl font-black tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-indigo-300 via-sky-300 to-emerald-300 font-title">
                    입자 클린 경매 <span id="gameModeBadgeHeader" class="text-xs px-2 py-0.5 rounded-full bg-indigo-500/30 text-indigo-300 border border-indigo-400/30 font-sans">실시간 미리보기</span>
                </h1>
                <p class="text-xs text-slate-400">중1 과학 [입자의 운동과 상태 변화] 게이미피케이션 수업 도구</p>
            </div>
        </div>

        <div class="flex items-center gap-2 mt-2 sm:mt-0">
            <div id="roomPinBadge" class="hidden px-3 py-1 rounded-xl bg-amber-500/20 border border-amber-500/40 text-amber-300 font-mono font-bold text-sm">
                📌 PIN: <span id="pinDisplay" class="text-base font-black">---</span>
            </div>
            <button id="soundToggleBtn" onclick="toggleSound()" class="px-3 py-1.5 rounded-xl glass-panel text-slate-300 hover:text-white hover:bg-slate-700/50 transition text-xs flex items-center gap-1.5">
                <i class="fa-solid fa-volume-high text-indigo-400" id="soundIcon"></i>
                <span id="soundText" class="hidden sm:inline">효과음 ON</span>
            </button>
            <button onclick="exitToHome()" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition text-xs flex items-center gap-1.5">
                <i class="fa-solid fa-house"></i>
                <span class="hidden sm:inline">메인으로</span>
            </button>
        </div>
    </header>

    <main id="appContainer" class="flex-grow flex flex-col justify-center">
        </main>

    <footer class="mt-4 text-center text-xs text-slate-500 py-1.5 border-t border-slate-800/60">
        수업디자인 연수 오전 강의용 | 중학교 1학년 과학 [Q-E-F-S 전략 경매 시스템]
    </footer>

    <div id="sheriffModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-panel bg-slate-900/90 border-2 border-amber-500/50 rounded-3xl p-6 md:p-8 max-w-lg w-full glow-effect relative transform transition-all duration-300 scale-95 opacity-0" id="sheriffModalCard">
            <button onclick="closeSheriffModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="flex items-center gap-3 text-amber-400 mb-4">
                <i class="fa-solid fa-shield-halved text-3xl animate-bounce"></i>
                <div>
                    <h3 class="text-xl font-bold font-title text-amber-300">보안관 지식 검증 리포트</h3>
                    <span class="text-xs text-amber-500/80" id="sheriffTeamName">나만의 비밀 힌트</span>
                </div>
            </div>
            <hr class="border-slate-700/60 mb-4">
            <div class="space-y-4 text-slate-200">
                <div class="bg-amber-950/30 border border-amber-500/30 rounded-2xl p-4">
                    <div class="text-xs text-amber-400 font-bold mb-1 flex items-center gap-1">

                    </div>
                    <p class="text-sm md:text-base font-semibold text-amber-100" id="sheriffHintText">
                        힌트 내용이 표시됩니다.
                    </p>

                <div class="bg-indigo-950/30 border border-indigo-500/30 rounded-2xl p-4">

                    </div>
                    <p class="text-xs md:text-sm text-slate-300" id="sheriffConceptText">
                        교과서 개념이 표시됩니다.
                    </p>
                </div>
            </div>
            <button onclick="closeSheriffModal()" class="w-full mt-6 py-3 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold rounded-xl shadow-lg transition text-sm">
                확인 완료
            </button>
        </div>
    </div>

    <div id="rescueQuizModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-panel bg-slate-900/90 border-2 border-emerald-500/50 rounded-3xl p-6 md:p-8 max-w-lg w-full glow-effect relative space-y-4">
            <div class="flex items-center gap-3 text-emerald-400">
                <i class="fa-solid fa-kit-medical text-3xl animate-pulse"></i>
                <div>
                    <h3 class="text-xl font-bold font-title text-emerald-300">보안관 회생 개념 퀴즈 (1회 제한)</h3>

                </div>
            </div>
            <hr class="border-slate-700/60">
            
            <div class="bg-slate-950/80 p-4 rounded-2xl border border-slate-800 space-y-3">
                <div class="text-xs text-amber-400 font-bold"><i class="fa-solid fa-circle-question"></i> 개념 확인 문제</div>
                <p class="text-sm font-semibold text-slate-100" id="rescueQuizStatement">
                    상태 변화가 일어날 때 물질을 이루는 입자의 [크기와 종류]는 변한다.
                </p>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="submitRescueAnswer(true)" class="py-3.5 rounded-2xl font-bold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-emerald-400 text-base transition">
                    ⭕ O (그렇다)
                </button>
                <button onclick="submitRescueAnswer(false)" class="py-3.5 rounded-2xl font-bold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-rose-400 text-base transition">
                    ❌ X (아니다)
                </button>
            </div>
        </div>
    </div>

    <script>
        // 전역 게임 상태
        window.gameState = {
            role: null, // 'host' | 'client'
            roomId: null,
            myTeamId: null,
            roomData: null,
            soundEnabled: true,
            setupGameMode: 'individual',
            setupCount: 21
        };

        window.clientLocalInput = {
            choice: null,
            bid: 10
        };

        window.db = null;
        window.auth = null;
        window.roomUnsubscribe = null;
        window.hostPingInterval = null;
        window.appId = 'particle-clean-auction';

        let resolveAuthPromise;
        window.authReady = new Promise((resolve) => {
            resolveAuthPromise = resolve;
        });

        window.getRoomDocRef = function(pin) {
            if (!window.db) return null;
            return window.db.collection('artifacts').doc(window.appId).collection('public').doc('data').collection('rooms').doc(pin);
        };

        // 과학 퀴즈 문항 데이터베이스
        window.questionBank = [
            {
                id: 1,
                category: "입자의 운동",
                statement: "물 위에 떨어진 물감이 스스로 퍼져 나가는 확산 현상은 입자가 모든 방향으로 움직이기 때문에 일어난다.",
                isTrue: true,
                sheriffHint: "포인트: 확산과 증발은 외력이 없어도 '입자의 자발적 운동'으로 발생합니다.",
                concept: "입자는 스스로 끊임없이 운동하며, 온도나 기체/액체 상태에 따라 운동 속도가 달라집니다.",
                explanation: "참(True)! 확산은 입자가 스스로 모든 방향으로 움직여 다른 물질 속으로 퍼져나가는 현상입니다."
            },
            {
                id: 2,
                category: "입자의 운동",
                statement: "젖은 빨래가 마르는 증발 현상은 액체 표면뿐만 아니라 액체 내부에서도 입자가 기체로 변해 날아가는 현상이다.",
                isTrue: false,
                sheriffHint: "포인트: '표면만' 기화하는가, '내부 전체에서' 기화하는가의 차이를 구분하세요!",
                concept: "표면에서만 기체로 변하는 것은 [증발], 액체 표면과 내부 모두에서 일어나는 것은 [끓음]입니다.",
                explanation: "거짓(False)! 액체 표면에서만 입자가 기체로 변하는 것은 '증발'이고, 내부에서도 기포가 생기며 일어나는 것은 '끓음'입니다."
            },
            {
                id: 3,
                category: "상태 변화와 입자",
                statement: "얼음이 녹아 물이 되는 현상을 액화라고 한다.",
                isTrue: false,
                sheriffHint: "포인트: 액화, 기화, 융해, 응고, 승화 중 골라보세요.",
                concept: "고체가 액체로 변하는 현상은 융해입니다. 기체가 액체로 변하는 현상을 액화라고 합니다.",
                explanation: "거짓(False)! 고체가 액체로 변하는 현상은 융해입니다. 기체가 액체로 변하는 현상을 액화라고 합니다."
            },
            {
                id: 4,
                category: "입자의 운동",
                statement: "증발 현상은 액체의 표면적이 넓을수록 잘 일어난다.",
                isTrue: true,
                sheriffHint: "포인트: 증발은 액체의 '표면'에서 액체가 기체로 변해 날아가는 현상입니다.",
                concept: "액체의 표면에서만 증발이 일어나므로, 표면적이 넓을수록 증발할 수 있는 면적이 넓어집니다.",
                explanation: "참(True)! 액체의 표면에서만 증발이 일어나므로, 표면적이 넓을수록 증발할 수 있는 면적이 넓어집니다."
            },
            {
                id: 5,
                category: "물질의 상태 변화",
                statement: "고체 드라이아이스가 점점 작아지는 현상은 승화입니다.",
                isTrue: true,
                sheriffHint: "포인트: 액화, 기화, 융해, 응고, 승화 중 골라보세요.",
                concept: "고체가 기체로, 기체가 고체로 변하는 것을 뜻하는 용어는 모두 같습니다.",
                explanation: "참(True)! 고체가 기체로, 기체가 고체로 변하는 것을 뜻하는 용어는 모두 승화입니다."
            },
            {
                id: 6,
                category: "상태 변화 용어",
                statement: "추운 겨울날 실내 창문 안쪽에 물방울이 서리는 현상은 기체가 액체로 변하는 '액화' 현상이다.",
                isTrue: true,
                sheriffHint: "포인트: 따뜻한 수증기(기체)가 차가운 유리창(액체)에 닿을 때의 변화를 확인하세요.",
                concept: "기체가 열을 방출하여 액체로 변하는 현상을 [액화]라고 합니다.",
                explanation: "참(True)! 공기 중의 수증기가 차가운 유리창을 만나 열을 잃고 물방울로 변하는 것은 '액화'입니다."
            },
            {
                id: 7,
                category: "입자의 운동",
                statement: "확산 현상은 공기가 없는 우주에서도 일어납니다.",
                isTrue: true,
                sheriffHint: "포인트: 확산 현상은 입자가 스스로 운동하기 때문에 일어납니다.",
                concept: "공기가 없는 우주에서도 물질을 이루는 입자는 항상 스스로 운동합니다.",
                explanation: "참(True)! 공기가 없는 우주에서도 물질을 이루는 입자는 항상 스스로 운동하므로, 확산 현상은 일어납니다."
            },
            {
                id: 8,
                category: "물질의 상태 변화",
                statement: "물이 얼어 얼음이 될 때(응고), 입자들의 운동은 점점 둔해진다.",
                isTrue: false,
                sheriffHint: "포인트: 얼음과 물 중 어떤 상태일 때 입자 운동이 더 활발할까요?",
                concept: "고체는 입자 운동이 둔하고 입자간의 거리가 매우 좁으며, 액체는 입자 운동이 비교적 활발합니다.",
                explanation: "거짓(False)! 고체는 입자 운동이 둔하고 입자간의 거리가 매우 좁으며, 액체는 입자 운동이 비교적 활발합니다."
            }
        ];

        window.showToast = function(msg) {
            var toast = document.getElementById('toastMessage');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toastMessage';
                toast.className = 'fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-indigo-600 text-white font-bold px-5 py-3 rounded-2xl shadow-2xl border border-indigo-400 text-sm transition-all duration-300 opacity-0 pointer-events-none flex items-center gap-2';
                document.body.appendChild(toast);
            }
            toast.innerHTML = `<i class="fa-solid fa-circle-info"></i> <span>${msg}</span>`;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(function() {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3200);
        };

        window.initApp = async function() {
            try {
                if (typeof firebase !== 'undefined') {
                    var firebaseConfig = {
                        apiKey: "AIzaSyCqnfjj_gyBZ3EEVOXJurhvsihlFj_emtE",
                        authDomain: "investment-9eab1.firebaseapp.com",
                        projectId: "investment-9eab1",
                        storageBucket: "investment-9eab1.firebasestorage.app",
                        messagingSenderId: "976762188659",
                        appId: "1:976762188659:web:1bac8684b9c38c573ccb06",
                        measurementId: "G-QEZ41GM2Y6"
                    };

                    if (!firebase.apps.length) {
                        firebase.initializeApp(firebaseConfig);
                    }
                    window.auth = firebase.auth();
                    window.db = firebase.firestore();

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await window.auth.signInWithCustomToken(__initial_auth_token);
                    } else {
                        await window.auth.signInAnonymously();
                    }
                }
            } catch (err) {
                console.warn("Firebase 초기화 중 경고:", err);
            } finally {
                if (resolveAuthPromise) resolveAuthPromise();
            }

            window.renderRoleSelection();
        };

        window.playSound = function(type) {
            if (!window.gameState.soundEnabled) return;
            try {
                var AudioCtx = window.AudioContext || window.webkitAudioContext;
                var audioCtx = new AudioCtx();
                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                var now = audioCtx.currentTime;
                if (type === 'click') {
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'sheriff') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.25);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.setValueAtTime(160, now + 0.15);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                }
            } catch (e) {}
        };

        window.toggleSound = function() {
            window.gameState.soundEnabled = !window.gameState.soundEnabled;
            document.getElementById('soundText').innerText = window.gameState.soundEnabled ? '효과음 ON' : '효과음 OFF';
            document.getElementById('soundIcon').className = window.gameState.soundEnabled ? 'fa-solid fa-volume-high text-indigo-400' : 'fa-solid fa-volume-xmark text-slate-500';
        };

        window.exitToHome = function() {
            if (confirm("메인 화면으로 돌아가시겠습니까? (진행 중인 경매 정보는 보존됩니다)")) {
                if (window.hostPingInterval) clearInterval(window.hostPingInterval);
                
                if (window.gameState.role === 'host' && window.db && window.gameState.roomId) {
                    window.getRoomDocRef(window.gameState.roomId).update({ hostActive: false });
                }

                if (window.roomUnsubscribe) {
                    window.roomUnsubscribe();
                    window.roomUnsubscribe = null;
                }

                window.gameState.role = null;
                window.gameState.roomId = null;
                document.getElementById('roomPinBadge').classList.add('hidden');
                window.renderRoleSelection();
            }
        };

        // 1. 역할 선택 랜딩 페이지
        window.renderRoleSelection = function() {
            var savedPin = localStorage.getItem('particle_auction_host_pin');
            var container = document.getElementById('appContainer');

            container.innerHTML = `
                <div class="max-w-4xl mx-auto w-full grid grid-cols-1 md:grid-cols-2 gap-6 my-auto">
                    <div class="glass-panel rounded-3xl p-6 md:p-8 glow-effect flex flex-col justify-between space-y-6 border border-indigo-500/30 hover:border-indigo-400 transition">
                        <div class="space-y-4">

                    <div class="glass-panel rounded-3xl p-6 md:p-8 glow-effect flex flex-col justify-between space-y-6 border border-emerald-500/30 hover:border-emerald-400 transition">
                        <div class="space-y-4">
                            <div class="w-14 h-14 rounded-2xl bg-emerald-600/30 border border-emerald-400/40 text-emerald-300 flex items-center justify-center text-2xl">

                            </div>

                                <h2 class="text-2xl font-black font-title text-emerald-100">📱 학생 / 모둠 기기 접속</h2>

        window.setHostGameMode = function(mode) {
            playSound('click');
            window.gameState.setupGameMode = mode;
            window.gameState.setupCount = mode === 'individual' ? 21 : 4;
            window.renderRoleSelection();
        };

        window.startHostHeartbeat = function(pin) {
            if (window.hostPingInterval) clearInterval(window.hostPingInterval);

            window.hostPingInterval = setInterval(() => {
                if (window.gameState.role === 'host' && window.db) {
                    window.getRoomDocRef(pin).update({
                        hostActive: true,
                        lastHostPing: Date.now()
                    }).catch(err => console.warn("Heartbeat update error:", err));
                }
            }, 3000);

            window.addEventListener('beforeunload', function() {
                if (window.gameState.role === 'host' && window.db && window.gameState.roomId) {
                    window.getRoomDocRef(window.gameState.roomId).update({ hostActive: false });
                }
            });
        };

        window.checkPinAndLoadTeams = async function(retryCount = 0) {
            await window.authReady;

            var pinInput = document.getElementById('joinPinInput');
            var statusDiv = document.getElementById('pinCheckStatus');
            var select = document.getElementById('joinTeamSelect');
            if (!pinInput || !statusDiv || !select) return;

            var rawPin = pinInput.value.replace(/[^0-9]/g, '');
            pinInput.value = rawPin;
            var pin = rawPin.trim();

            if (pin.length < 4) {
                statusDiv.className = "text-[11px] mt-1 text-slate-400 text-center font-bold";
                statusDiv.innerText = "PIN 번호 4자리를 입력해주세요";
                select.innerHTML = '<option value="">PIN 번호를 먼저 입력하세요</option>';
                return;
            }

            statusDiv.className = "text-[11px] mt-1 text-indigo-300 text-center font-bold";
            statusDiv.innerText = retryCount > 0 ? `🔍 방 정보를 검색 중입니다 (${retryCount}/3)...` : "🔍 방 정보 확인 중...";

            if (window.db) {
                try {
                    var docSnap = await window.getRoomDocRef(pin).get();
                    if (docSnap.exists) {
                        var room = docSnap.data();
                        statusDiv.className = "text-[11px] mt-1 text-emerald-400 text-center font-bold";
                        statusDiv.innerText = "✅ 방 확인 완료 (" + (room.mode === 'individual' ? room.maxPlayers + '명 개별전' : room.maxPlayers + '개 모둠전') + ")";
                        window.updateJoinSelectOptions(room);
                    } else if (retryCount < 2) {
                        setTimeout(() => window.checkPinAndLoadTeams(retryCount + 1), 800);
                    } else {
                        statusDiv.className = "text-[11px] mt-1 text-rose-400 text-center font-bold";
                        statusDiv.innerText = "❌ 존재하지 않는 PIN 번호입니다.";
                        select.innerHTML = '<option value="">올바른 PIN을 입력하세요</option>';
                    }
                } catch (err) {
                    console.error("Firestore get error:", err);
                    statusDiv.className = "text-[11px] mt-1 text-rose-400 text-center font-bold";
                    statusDiv.innerText = "❌ 서버 접속 실패 (Firebase 규칙 확인)";
                }
            } else if (window.gameState.roomData && window.gameState.roomData.roomId === pin) {
                var room = window.gameState.roomData;
                statusDiv.className = "text-[11px] mt-1 text-emerald-400 text-center font-bold";
                statusDiv.innerText = "✅ 방 확인 완료 (미리보기 모드)";
                window.updateJoinSelectOptions(room);
            } else {
                statusDiv.className = "text-[11px] mt-1 text-rose-400 text-center font-bold";
                statusDiv.innerText = "❌ 존재하지 않는 PIN 번호입니다.";
                select.innerHTML = '<option value="">올바른 PIN을 입력하세요</option>';
            }
        };

        window.updateJoinSelectOptions = function(data) {
            var select = document.getElementById('joinTeamSelect');
            if (!select || !data || !data.teams) return;

            var teamsList = Object.values(data.teams);
            var html = '';
            teamsList.forEach(function(t) {
                var statusText = t.joined ? ' (🟢 접속됨)' : ' (⚪ 미접속)';
                html += `<option value="${t.id}">${t.name}${statusText}</option>`;
            });
            select.innerHTML = html;
        };

        window.reconnectHostByInputPin = function() {
            var input = document.getElementById('hostReconnectPinInput');
            if (!input) return;
            var pin = input.value.replace(/[^0-9]/g, '').trim();

            if (!pin || pin.length !== 4) {
                window.showToast("4자리 방 PIN 번호를 정확히 입력하세요!");
                return;
            }
            window.reconnectHostRoom(pin);
        };

        window.reconnectHostRoom = async function(pin) {
            playSound('click');
            await window.authReady;

            if (window.db) {
                try {
                    var docSnap = await window.getRoomDocRef(pin).get();
                    if (docSnap.exists) {
                        window.gameState.role = 'host';
                        window.gameState.roomId = pin;
                        window.gameState.roomData = docSnap.data();

                        localStorage.setItem('particle_auction_host_pin', pin);

                        document.getElementById('pinDisplay').innerText = pin;
                        document.getElementById('roomPinBadge').classList.remove('hidden');

                        await window.getRoomDocRef(pin).update({
                            hostActive: true,
                            lastHostPing: Date.now()
                        });

                        if (window.roomUnsubscribe) window.roomUnsubscribe();
                        window.roomUnsubscribe = window.getRoomDocRef(pin).onSnapshot(function(snap) {
                            if (snap.exists) {
                                window.gameState.roomData = snap.data();
                                window.renderHostScreen();
                            }
                        });

                        window.startHostHeartbeat(pin);
                        window.renderHostScreen();
                        window.showToast(`🎉 PIN ${pin}번 경매방에 교사 권한으로 복귀했습니다!`);
                        return;
                    }
                } catch (err) {
                    console.error("Reconnect error:", err);
                }
            }
            window.showToast("입력한 PIN 번호의 방을 찾을 수 없습니다.");
        };

        window.setupHostRoom = async function() {
            playSound('click');
            await window.authReady;

            var pin = Math.floor(1000 + Math.random() * 9000).toString();
            window.gameState.role = 'host';
            window.gameState.roomId = pin;

            localStorage.setItem('particle_auction_host_pin', pin);

            document.getElementById('pinDisplay').innerText = pin;
            document.getElementById('roomPinBadge').classList.remove('hidden');

            var mode = window.gameState.setupGameMode;
            var count = window.gameState.setupCount || (mode === 'individual' ? 21 : 4);

            var initialParticipants = {};
            for (var i = 1; i <= count; i++) {
                var key = i.toString();
                var name = mode === 'individual' ? `${i}번` : `${i}모둠`;
                initialParticipants[key] = {
                    id: key,
                    name: name,
                    points: 100,
                    sheriffChances: 2,
                    currentBid: 10,
                    choice: null,
                    submitted: false,
                    joined: false,
                    sheriffModalData: null,
                    rescueRequested: false,
                    rescueUsed: false // 📌 구제 기회 1회 제한 플래그
                };
            }

            var roomData = {
                roomId: pin,
                mode: mode,
                maxPlayers: count,
                status: 'waiting',
                currentQuestionIdx: 0,
                isRevealed: false,
                teams: initialParticipants,
                hostActive: true,
                lastHostPing: Date.now(),
                updatedAt: Date.now()
            };

            window.gameState.roomData = roomData;

            if (window.db) {
                try {
                    await window.getRoomDocRef(pin).set(roomData);
                    if (window.roomUnsubscribe) window.roomUnsubscribe();
                    window.roomUnsubscribe = window.getRoomDocRef(pin).onSnapshot(function(docSnap) {
                        if (docSnap.exists) {
                            window.gameState.roomData = docSnap.data();
                            window.renderHostScreen();
                        }
                    });
                    window.startHostHeartbeat(pin);
                } catch (e) {
                    console.error("Host room creation error:", e);
                    window.showToast("방 생성 중 오류가 발생했습니다.");
                }
            }
            window.renderHostScreen();
        };

        window.renderHostScreen = function() {
            var data = window.gameState.roomData;
            if (!data) return;
            if (data.status === 'waiting') {
                window.renderHostLobby();
            } else if (data.status === 'playing') {
                window.renderHostDashboard();
            } else if (data.status === 'debriefing') {
                window.renderDebriefingViewHost();
            }
        };

        window.renderHostLobby = function() {
            var container = document.getElementById('appContainer');
            var data = window.gameState.roomData;
            var teamsList = Object.values(data.teams);
            var totalCount = teamsList.length;
            var joinedCount = teamsList.filter(function(t) { return t.joined; }).length;
            var isIndividual = data.mode === 'individual';

            var gridCols = "grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-7";
            if (totalCount <= 6) {
                gridCols = "grid-cols-2 sm:grid-cols-3 lg:grid-cols-4";
            }

            document.getElementById('gameModeBadgeHeader').innerText = isIndividual ? `개별전 대기실 (${totalCount}명)` : `모둠전 대기실 (${totalCount}모둠)`;

            container.innerHTML = `
                <div class="max-w-5xl mx-auto w-full space-y-4 my-auto py-2">
                    <div class="glass-panel rounded-3xl p-6 md:p-8 text-center glow-effect border-2 border-indigo-500/40 relative overflow-hidden">
                        <div class="text-xs sm:text-sm font-bold text-indigo-300 tracking-wider uppercase mb-1">
                            <i class="fa-solid fa-wifi mr-1.5 animate-pulse text-emerald-400"></i>학생 기기 접속용 방 PIN 번호
                        </div>
                        <div class="text-6xl sm:text-8xl font-black font-mono tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-yellow-200 to-amber-400 my-2 drop-shadow-lg">
                            ${data.roomId}
                        </div>
                        <p class="text-xs sm:text-sm text-slate-300">
                            학생들은 오른쪽 <span class="text-emerald-300 font-bold">'학생 접속'</span>에서 PIN 번호 <span class="font-bold text-amber-300 font-mono text-base">${data.roomId}</span>와(과) 본인 번호를 선택하여 입장하세요.
                        </p>

                        <div class="mt-4 pt-4 border-t border-slate-700/50 flex flex-wrap justify-between items-center gap-3">
                            <div class="flex items-center gap-2 text-xs md:text-sm font-bold">
                                <span class="text-slate-400">접속 현황:</span>
                                <span class="text-emerald-400 font-black text-lg md:text-xl">${joinedCount} / ${totalCount} ${isIndividual ? '명' : '모둠'}</span>
                                <span class="text-xs font-normal text-slate-400">(${Math.round((joinedCount/totalCount)*100)}%)</span>

                            <div class="flex items-center gap-2">
                                <button onclick="simulateMockJoins()" class="px-3 py-1.5 bg-purple-500/20 hover:bg-purple-500/30 border border-purple-500/40 text-purple-300 text-xs rounded-xl font-bold transition flex items-center gap-1.5">
                                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                                    <span>전원 가상 접속 시뮬레이션</span>
                                </button>
                                <button onclick="changeParticipantCountHost()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 text-xs rounded-xl font-bold transition">
                                    <i class="fa-solid fa-users-gear mr-1"></i>인원 변경
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="glass-panel rounded-3xl p-5 border border-slate-800 space-y-3">
                        <div class="flex justify-between items-center px-1">
                            <h3 class="font-bold text-sm text-slate-200 font-title flex items-center gap-2">
                                <i class="fa-solid fa-users text-indigo-400"></i>
                                <span>참가자 실시간 접속 현황</span>
                            </h3>
                            <div class="flex items-center gap-3 text-xs">
                                <span class="flex items-center gap-1 text-emerald-400 font-bold"><span class="w-2.5 h-2.5 rounded-full bg-emerald-400 inline-block animate-ping"></span> 접속 완료 (${joinedCount})</span>
                                <span class="flex items-center gap-1 text-slate-500"><span class="w-2.5 h-2.5 rounded-full bg-slate-700 inline-block"></span> 미접속 (${totalCount - joinedCount})</span>
                            </div>
                        </div>

                        <div class="grid ${gridCols} gap-2.5 max-h-[38vh] overflow-y-auto p-1">
                            ${teamsList.map(function(t) {
                                return `
                                    <div class="p-3 rounded-2xl border text-center transition flex flex-col justify-between items-center space-y-1 ${t.joined ? 'bg-emerald-950/40 border-emerald-500/60 text-emerald-200 shadow-md shadow-emerald-950/50' : 'bg-slate-900/40 border-slate-800 text-slate-500'}">
                                        <div class="w-8 h-8 rounded-xl flex items-center justify-center font-bold text-sm ${t.joined ? 'bg-emerald-500/30 text-emerald-300 border border-emerald-400/40' : 'bg-slate-800 text-slate-600'}">
                                            <i class="fa-solid ${t.joined ? 'fa-user-check' : 'fa-user'}"></i>
                                        </div>
                                        <div class="font-bold text-xs truncate w-full font-title">${t.name}</div>
                                        <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${t.joined ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-slate-800/80 text-slate-500'}">
                                            ${t.joined ? '접속 완료' : '대기 중'}
                                        </span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <button onclick="startHostGame()" class="w-full py-4 bg-gradient-to-r from-emerald-500 via-teal-500 to-indigo-600 hover:from-emerald-400 hover:to-indigo-500 text-slate-950 font-black rounded-2xl shadow-xl transition font-title text-lg flex items-center justify-center gap-3">
                        <i class="fa-solid fa-play text-xl animate-bounce"></i>
                        <span>입자 클린 경매 시작하기 (문항 1 진행)</span>
                    </button>
                </div>
            `;
        };

            playSound('click');
            var data = window.gameState.roomData;
            Object.values(data.teams).forEach(function(t) {
                t.joined = true;
            });

            if (window.db) {
                window.getRoomDocRef(data.roomId).update({ teams: data.teams });
            } else {
                window.renderHostScreen();
            }
        };

        window.startHostGame = function() {
            playSound('correct');
            var data = window.gameState.roomData;
            data.status = 'playing';

            if (window.db) {
                window.getRoomDocRef(data.roomId).update({
                    status: 'playing',
                    updatedAt: Date.now()
                });
            } else {
                window.renderHostScreen();
            }
        };

        // 2. 교사 대시보드
        window.renderHostDashboard = function() {
            var container = document.getElementById('appContainer');
            var data = window.gameState.roomData;
            var q = window.questionBank[data.currentQuestionIdx];

            var teamsList = Object.values(data.teams);
            var totalCount = teamsList.length;
            var submittedCount = teamsList.filter(function(t) { return t.submitted; }).length;
            var isIndividual = data.mode === 'individual';

            var gridCols = "grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-7";
            if (totalCount <= 6) {
                gridCols = "grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4";

            }

                    t.choice = Math.random() > 0.35 ? (window.questionBank[data.currentQuestionIdx].isTrue ? 'True' : 'False') : (window.questionBank[data.currentQuestionIdx].isTrue ? 'False' : 'True');

                    t.submitted = true;
                }
            });

            if (window.db) {
                window.getRoomDocRef(data.roomId).update({ teams: data.teams });
            } else {
                window.renderHostScreen();
            }
        };

        window.revealHostResult = function() {
            playSound('correct');
            var data = window.gameState.roomData;
            var q = window.questionBank[data.currentQuestionIdx];

            data.isRevealed = true;

            Object.values(data.teams).forEach(function(t) {
                if (t.submitted && t.choice) {
                    var isCorrect = (t.choice === 'True' && q.isTrue) || (t.choice === 'False' && !q.isTrue);
                    if (isCorrect) {
                        t.points += t.currentBid;
                    } else {
                        t.points = Math.max(0, t.points - t.currentBid);
                    }
                }
            });

            if (window.db) {
                window.getRoomDocRef(data.roomId).update({
                    isRevealed: true,
                    teams: data.teams,
                    updatedAt: Date.now()
                });
            } else {
                window.renderHostScreen();

        // 3. 학생 클라이언트 접속
        window.joinClientRoom = async function() {
            playSound('click');

            var selectVal = document.getElementById('joinTeamSelect') ? document.getElementById('joinTeamSelect').value : '';

            if (!pin || pin.length !== 4) {
                window.showToast("올바른 4자리 방 PIN 번호를 입력하세요!");
                return;
            }

            if (!selectVal) {
                window.showToast("내 번호/모둠을 선택해 주세요!");
                return;
            }

            var teamId = selectVal;
            if (selectVal.indexOf('team_') === 0) {
                teamId = selectVal.replace('team_', '');
            }

            window.gameState.role = 'client';
            window.gameState.roomId = pin;
            window.gameState.myTeamId = teamId;

            document.getElementById('pinDisplay').innerText = pin;
            document.getElementById('roomPinBadge').classList.remove('hidden');

            if (window.db) {
                try {
                    var docSnap = await window.getRoomDocRef(pin).get();
                    if (!docSnap.exists) {
                        window.showToast("존재하지 않는 방 번호입니다. 교사 화면의 PIN 번호를 확인하세요.");
                        return;
                    }

                    var room = docSnap.data();
                    if (!room.teams) room.teams = {};
                    
                    if (!room.teams[teamId]) {
                        var isIndiv = room.mode === 'individual';
                        room.teams[teamId] = {
                            id: teamId,
                            name: isIndiv ? teamId + '번' : teamId + '모둠',
                            points: 100,
                            sheriffChances: 2,
                            currentBid: 10,
                            choice: null,
                            submitted: false,
                            joined: true,
                            sheriffModalData: null,
                            rescueRequested: false,
                            rescueUsed: false
                        };
                    } else {
                        room.teams[teamId].joined = true;
                    }

                    await window.getRoomDocRef(pin).update({ teams: room.teams });

                    if (window.roomUnsubscribe) window.roomUnsubscribe();
                    window.roomUnsubscribe = window.getRoomDocRef(pin).onSnapshot(function(snap) {
                        if (snap.exists) {
                            window.gameState.roomData = snap.data();
                            window.renderClientDashboard();
                            window.checkSheriffModalState();
                        }
                    }, function(error) {
                        console.error("Snapshot error:", error);
                        window.showToast("실시간 연결에 문제가 발생했습니다.");
                    });
                } catch (err) {
                    console.error("Join error:", err);
                    window.showToast("방 입장 중 오류가 발생했습니다. 다시 시도해 주세요.");

                if (!window.gameState.roomData) {
                    var initialParticipants = {};
                    for (var i = 1; i <= 21; i++) {
                        var key = i.toString();
                        initialParticipants[key] = {
                            id: key, name: key + '번', points: 100, sheriffChances: 2, currentBid: 10, choice: null, submitted: false, joined: false, sheriffModalData: null, rescueRequested: false, rescueUsed: false
                        };
                    }
                    window.gameState.roomData = {
                        roomId: pin,
                        mode: 'individual',
                        maxPlayers: 21,
                        status: 'waiting',
                        currentQuestionIdx: 0,
                        isRevealed: false,
                        teams: initialParticipants,
                        hostActive: true,
                        updatedAt: Date.now()

                if (window.gameState.roomData.teams && window.gameState.roomData.teams[teamId]) {
                    window.gameState.roomData.teams[teamId].joined = true;
                }
                window.renderClientDashboard();
            }

                        </div>
                    </div>

                    <div class="glass-panel rounded-2xl p-5 text-center space-y-3">
                        <span class="text-xs font-bold px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-400/30">
                            문항 ${data.currentQuestionIdx + 1} / ${window.questionBank.length} · [${q.category}]
                        </span>
                        <div class="bg-slate-950/80 p-4 rounded-2xl border border-slate-800 my-1">
                            <h2 class="text-base md:text-lg font-bold text-slate-100 leading-relaxed font-title">
                                "${q.statement}"
                            </h2>
                        </div>
                    </div>

                    ${!data.isRevealed ? `
                        ${isBankrupt ? `
                            ${myTeam.rescueRequested ? `
                                <div class="glass-panel rounded-2xl p-6 text-center space-y-3 border-2 border-amber-500/50 bg-amber-950/20">
                                    <div class="w-12 h-12 rounded-2xl bg-amber-500/20 text-amber-300 border border-amber-400/30 flex items-center justify-center text-2xl mx-auto">
                                        <i class="fa-solid fa-hourglass-half fa-spin"></i>
                                    </div>
                                    <h3 class="text-lg font-black font-title text-amber-300">구제 요청 제출 완료!</h3>
                                    <p class="text-xs text-slate-300 leading-relaxed">
                                        회생 퀴즈를 맞췄습니다!<br>
                                        선생님이 전면 스크린에서 <strong class="text-amber-400">'지원금 지급'</strong> 버튼을 누르시면 +40 pt를 받고 경매에 복귀합니다.
                                    </p>
                                </div>
                            ` : `
                                <div class="glass-panel rounded-2xl p-6 text-center space-y-4 border-2 border-rose-500/50 bg-rose-950/20">
                                    <div class="text-4xl">💸</div>
                                    <div>
                                        <h3 class="text-xl font-black font-title text-rose-300">자금이 모두 소진되었습니다!</h3>
                                        <p class="text-xs text-slate-300 mt-1">${myTeam.rescueUsed ? '이미 이번 수업의 구제 기회를 모두 사용하셨습니다.' : '간단한 회생 퀴즈를 맞추고 선생님께 지원금을 신청하세요.'}</p>
                                    </div>
                                    ${!myTeam.rescueUsed ? `
                                        <button onclick="openRescueQuizModal()" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-black rounded-2xl shadow-xl transition font-title text-base flex items-center justify-center gap-2 badge-glow">
                                            <i class="fa-solid fa-file-pen text-lg"></i>
                                            <span>보안관 회생 퀴즈 도전하기 (+40 pt 신청)</span>
                                        </button>
                                    ` : ''}
                                </div>
                            `}
                        ` : `
                            <div id="clientBiddingForm" class="glass-panel rounded-2xl p-5 space-y-4 border border-indigo-500/30">
                                <div class="flex justify-between items-center">
                                    <h3 class="font-bold text-sm text-slate-300 font-title"><i class="fa-solid fa-gavel text-amber-400 mr-2"></i>참/거짓 및 입찰가 선택</h3>
                                    <button onclick="clientUseSheriffChance()" id="sheriffBtn" ${myTeam.sheriffChances <= 0 || myTeam.submitted ? 'disabled' : ''} class="px-2.5 py-1.5 rounded-xl border text-xs font-bold transition ${myTeam.sheriffChances > 0 && !myTeam.submitted ? 'bg-amber-500/20 hover:bg-amber-500/30 border-amber-500/40 text-amber-300 badge-glow' : 'bg-slate-800/50 border-slate-700 text-slate-600 cursor-not-allowed'}">
                                        <i class="fa-solid fa-shield-halved text-amber-400 mr-1"></i>보안관 찬스 (<span id="sheriffCount">${myTeam.sheriffChances}</span>)
                                    </button>
                                </div>

                                <div class="grid grid-cols-2 gap-3">
                                    <button onclick="clientSelectChoice('True')" id="btnChoiceTrue" ${myTeam.submitted ? 'disabled' : ''} class="py-3 rounded-2xl font-bold border text-sm transition ${currentChoice === 'True' ? 'bg-emerald-600 border-emerald-400 text-white shadow-lg' : 'bg-slate-900 border-slate-700 text-slate-300 hover:bg-slate-800'}">
                                        ⭕ 참 (True)
                                    </button>
                                    <button onclick="clientSelectChoice('False')" id="btnChoiceFalse" ${myTeam.submitted ? 'disabled' : ''} class="py-3 rounded-2xl font-bold border text-sm transition ${currentChoice === 'False' ? 'bg-rose-600 border-rose-400 text-white shadow-lg' : 'bg-slate-900 border-slate-700 text-slate-300 hover:bg-slate-800'}">
                                        ❌ 거짓 (False)
                                    </button>
                                </div>

                                <div class="space-y-2 pt-1">
                                    <div class="flex justify-between text-xs text-slate-400">
                                        <span>입찰 베팅 금액</span>
                                        <span id="bidValueDisplay" class="text-amber-300 font-black text-sm">${currentBid} pt</span>
                                    </div>
                                    <input type="range" id="bidRangeInput" min="10" max="${Math.max(10, myTeam.points)}" step="5" value="${currentBid}" oninput="clientUpdateBid(this.value)" ${myTeam.submitted ? 'disabled' : ''} class="w-full accent-indigo-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
                                </div>

                                <button onclick="clientSubmitBid()" id="btnSubmitBid" ${!currentChoice ? 'disabled' : ''} class="w-full py-3.5 rounded-xl font-black transition font-title text-base flex items-center justify-center gap-2 ${myTeam.submitted ? 'bg-emerald-700 text-emerald-100 cursor-default' : (currentChoice ? 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg' : 'bg-slate-800 text-slate-500 cursor-not-allowed')}">
                                    <i class="fa-solid fa-paper-plane"></i>
                                    <span>${myTeam.submitted ? '입찰 제출 완료 (수정 가능)' : '입찰 제출하기'}</span>
                                </button>
                            </div>
                        `}
                    ` : `
                        <div class="glass-panel rounded-2xl p-6 text-center space-y-3 border-2 ${ (myTeam.choice === 'True' && q.isTrue) || (myTeam.choice === 'False' && !q.isTrue) ? 'border-emerald-500 bg-emerald-950/20' : 'border-rose-500 bg-rose-950/20'}">
                            <div class="text-3xl">
                                ${ (myTeam.choice === 'True' && q.isTrue) || (myTeam.choice === 'False' && !q.isTrue) ? '🎉' : '💥'}
                            </div>
                            <h3 class="text-xl font-black font-title ${ (myTeam.choice === 'True' && q.isTrue) || (myTeam.choice === 'False' && !q.isTrue) ? 'text-emerald-300' : 'text-rose-300'}">
                                ${ (myTeam.choice === 'True' && q.isTrue) || (myTeam.choice === 'False' && !q.isTrue) ? '낙찰 성공! 포인트 획득' : '낙찰 실패! 포인트 차감'}
                            </h3>
                            <p class="text-xs text-slate-300">
                                선생님의 다음 문항 진행을 기다려주세요.
                            </p>
                        </div>
                    `}
                </div>
            `;
        };

        window.openRescueQuizModal = function() {
            playSound('sheriff');
            document.getElementById('rescueQuizModal').classList.remove('hidden');
        };

        window.submitRescueAnswer = function(answer) {
            var isCorrect = (answer === false);

            if (isCorrect) {
                playSound('correct');
                document.getElementById('rescueQuizModal').classList.add('hidden');
                
                var data = window.gameState.roomData;
                var myTeamId = window.gameState.myTeamId;
                
                data.teams[myTeamId].rescueRequested = true;

                if (window.db) {
                    window.getRoomDocRef(data.roomId).update({ teams: data.teams });
                } else {
                    window.renderClientDashboard();
                }
                window.showToast("✅ 회생 퀴즈 정답! 선생님에게 구제 신청이 제출되었습니다.");
            } else {
                playSound('wrong');
                window.showToast("❌ 오답입니다! 상태 변화 시 입자 자체의 크기/종류는 절대 변하지 않습니다. 다시 풀어보세요.");
            }
        };

        window.clientSelectChoice = function(choice) {
            playSound('click');
            window.clientLocalInput.choice = choice;

            var btnTrue = document.getElementById('btnChoiceTrue');
            var btnFalse = document.getElementById('btnChoiceFalse');
            var btnSubmit = document.getElementById('btnSubmitBid');

            if (btnTrue && btnFalse) {
                if (choice === 'True') {
                    btnTrue.className = 'py-3 rounded-2xl font-bold border text-sm transition bg-emerald-600 border-emerald-400 text-white shadow-lg';
                    btnFalse.className = 'py-3 rounded-2xl font-bold border text-sm transition bg-slate-900 border-slate-700 text-slate-300 hover:bg-slate-800';
                } else {
                    btnTrue.className = 'py-3 rounded-2xl font-bold border text-sm transition bg-slate-900 border-slate-700 text-slate-300 hover:bg-slate-800';
                    btnFalse.className = 'py-3 rounded-2xl font-bold border text-sm transition bg-rose-600 border-rose-400 text-white shadow-lg';
                }
            }

            if (btnSubmit) {
                btnSubmit.disabled = false;
                btnSubmit.className = 'w-full py-3.5 rounded-xl font-black transition font-title text-base flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg';
            }
        };

        window.clientUpdateBid = function(val) {
            window.clientLocalInput.bid = parseInt(val);

            var display = document.getElementById('bidValueDisplay');
            if (display) {
                display.innerText = val + ' pt';
            }
        };

        window.clientSubmitBid = function() {
            playSound('click');
            var data = window.gameState.roomData;
            var myTeamId = window.gameState.myTeamId;
            
            data.teams[myTeamId].choice = window.clientLocalInput.choice;
            data.teams[myTeamId].currentBid = window.clientLocalInput.bid || 10;
            data.teams[myTeamId].submitted = true;

            if (window.db) {
                window.getRoomDocRef(data.roomId).update({ teams: data.teams });
            } else {
                window.renderClientDashboard();
            }
        };

        window.clientUseSheriffChance = function() {
            var data = window.gameState.roomData;
            var myTeamId = window.gameState.myTeamId;
            var myTeam = data.teams[myTeamId];

            if (myTeam.sheriffChances > 0) {
                playSound('sheriff');
                myTeam.sheriffChances -= 1;
                var q = window.questionBank[data.currentQuestionIdx];

                myTeam.sheriffModalData = {
                    teamName: myTeam.name + ' 학생',
                    sheriffHint: q.sheriffHint,
                    concept: q.concept,
                    timestamp: Date.now()
                };

                if (window.db) {
                    window.getRoomDocRef(data.roomId).update({
                        teams: data.teams
                    });
                } else {
                    window.checkSheriffModalState();
                }
            }
        };

        window.checkSheriffModalState = function() {
            var data = window.gameState.roomData;
            var myTeamId = window.gameState.myTeamId;

            if (window.gameState.role === 'client' && data && data.teams && data.teams[myTeamId] && data.teams[myTeamId].sheriffModalData) {
                var myModalData = data.teams[myTeamId].sheriffModalData;
                
                document.getElementById('sheriffTeamName').innerText = myModalData.teamName + '의 보안관 찬스!';
                document.getElementById('sheriffHintText').innerText = myModalData.sheriffHint;
                document.getElementById('sheriffConceptText').innerText = myModalData.concept;

                var modal = document.getElementById('sheriffModal');
                var card = document.getElementById('sheriffModalCard');
                modal.classList.remove('hidden');
                setTimeout(function() {
                    card.classList.remove('scale-95', 'opacity-0');
                    card.classList.add('scale-100', 'opacity-100');
                }, 10);
            }
        };

        window.closeSheriffModal = function() {
            playSound('click');
            var modal = document.getElementById('sheriffModal');
            var card = document.getElementById('sheriffModalCard');
            card.classList.remove('scale-100', 'opacity-100');
            card.classList.add('scale-95', 'opacity-0');
            setTimeout(function() {
                modal.classList.add('hidden');
            }, 200);

            if (window.gameState.role === 'client' && window.db) {
                var data = window.gameState.roomData;
                var myTeamId = window.gameState.myTeamId;
                if (data && data.teams && data.teams[myTeamId]) {
                    data.teams[myTeamId].sheriffModalData = null;
                    window.getRoomDocRef(data.roomId).update({ teams: data.teams });
                }
            }
        };

        // 4. 최종 디브리핑 리포트 (지원금 수령 여부 함께 표시)
        window.renderDebriefingViewHost = function() {
            playSound('correct');
            var data = window.gameState.roomData;
            data.status = 'debriefing';

            if (window.db) {
                window.getRoomDocRef(data.roomId).update({ status: 'debriefing' });
            }

            var teamsList = Object.values(data.teams).sort(function(a, b) { return b.points - a.points; });
            var container = document.getElementById('appContainer');

            container.innerHTML = `
                <div class="max-w-4xl mx-auto w-full space-y-6 my-auto py-4">
                    <div class="glass-panel rounded-3xl p-6 text-center glow-effect border-2 border-amber-500/40 space-y-2">
                        <div class="inline-block bg-amber-500/20 text-amber-400 p-3 rounded-2xl border border-amber-400/30">
                            <i class="fa-solid fa-trophy text-4xl"></i>
                        </div>
                        <h2 class="text-3xl font-black font-title text-amber-300">최종 경매 결과 & 오개념 디브리핑</h2>
                        <p class="text-sm text-slate-300">1학기 과학 개념 검증 완수를 축하합니다!</p>
                    </div>

                    <div class="glass-panel rounded-3xl p-6 space-y-4">
                        <h3 class="text-lg font-bold font-title text-indigo-300 flex items-center gap-2">
                            <i class="fa-solid fa-ranking-star"></i> 최종 순위표 (${data.mode === 'individual' ? '개별전 21명' : '모둠전'})
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 max-h-[48vh] overflow-y-auto p-1">
                            ${teamsList.map(function(team, idx) {
                                var rescueBadge = team.rescueUsed 
                                    ? `<span class="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-1.5 py-0.5 rounded font-bold ml-2">구제 사용 💡</span>` 
                                    : `<span class="text-[10px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded font-bold ml-2">정상 진행 ✨</span>`;

                                return `
                                    <div class="bg-slate-900/80 p-3.5 rounded-2xl border ${idx === 0 ? 'border-amber-400/60 bg-amber-950/20' : 'border-slate-700/60'} flex justify-between items-center">
                                        <div class="flex items-center gap-2.5 truncate">
                                            <span class="w-7 h-7 rounded-xl font-black text-xs flex items-center justify-center shrink-0 ${idx === 0 ? 'bg-amber-400 text-slate-950' : idx === 1 ? 'bg-slate-300 text-slate-950' : idx === 2 ? 'bg-amber-700 text-white' : 'bg-slate-800 text-slate-400'}">
                                                ${idx + 1}
                                            </span>
                                            <span class="font-bold text-sm text-slate-100 font-title truncate">${team.name}</span>
                                            ${rescueBadge}
                                        </div>
                                        <div class="text-emerald-400 font-black text-base shrink-0">
                                            ${team.points} pt
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <button onclick="finishClassAndClear()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-2xl shadow-xl transition text-base font-title">
                        수업 완수 및 메인으로 돌아가기
                    </button>
                </div>
            `;
        };

        window.finishClassAndClear = function() {
            localStorage.removeItem('particle_auction_host_pin');
            if (window.hostPingInterval) clearInterval(window.hostPingInterval);
            if (window.roomUnsubscribe) {
                window.roomUnsubscribe();
                window.roomUnsubscribe = null;
            }
            window.gameState.role = null;
            window.gameState.roomId = null;
            document.getElementById('roomPinBadge').classList.add('hidden');
            window.renderRoleSelection();
        };

        // DOM 준비 후 초기화
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', window.initApp);
        } else {
            window.initApp();
        }
    </script>
</body>
</html>
